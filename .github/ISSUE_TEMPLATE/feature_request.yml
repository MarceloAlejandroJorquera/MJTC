name: Feature request
description: Suggest an improvement for MJTC.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow or limitation should be improved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior or interface.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples, screenshots, interoperability details, or alternatives.
